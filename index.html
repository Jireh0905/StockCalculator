<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f1f3f5" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#101214" media="(prefers-color-scheme: dark)">
    <title>주식 손익 계산기</title>
    <!-- 한글 웹폰트 Pretendard (무료 오픈소스 폰트). 불러오지 못하면 기기 기본 글꼴로 표시됨 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <style>
        /* =========================================================
         * 디자인 토큰 (색상·모서리 등 공통 값을 변수로 모아둠)
         * → 색을 바꾸고 싶으면 여기만 고치면 전체에 반영됨
         * ========================================================= */
        :root {
            --bg: #f1f3f5;          /* 페이지 배경 */
            --surface: #ffffff;     /* 카드 배경 */
            --surface-2: #f8f9fa;   /* 입력칸 배경 */
            --text: #212529;        /* 본문 글자 */
            --text-2: #495057;      /* 보조 글자 */
            --text-3: #868e96;      /* 흐린 글자(단위, 안내) */
            --border: #e9ecef;
            --primary: #4c6ef5;     /* 강조색(선택된 탭, 포커스) */
            --primary-weak: #edf2ff;
            /* 한국 증시 관례: 상승·이익 = 빨강, 하락·손실 = 파랑 */
            --up: #e03131;
            --up-weak: #fff5f5;
            --down: #1c7ed6;
            --down-weak: #e7f5ff;
            --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
            --radius: 16px;
            --radius-sm: 12px;
        }
        /* 다크 모드: 휴대폰이 다크 모드면 자동으로 어두운 색으로 바뀜 */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #101214;
                --surface: #1a1d21;
                --surface-2: #22262b;
                --text: #f1f3f5;
                --text-2: #ced4da;
                --text-3: #868e96;
                --border: #2c3036;
                --primary: #748ffc;
                --primary-weak: #23284a;
                --up: #ff6b6b;
                --up-weak: #3a1e21;
                --down: #4dabf7;
                --down-weak: #172c3d;
                --shadow: none;
            }
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui,
                         'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }
        button { font: inherit; color: inherit; }

        .app {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px 16px 48px;
        }

        /* ---------- 상단 헤더 ---------- */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 4px 16px;
        }
        .app-header h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .history-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 36px;
            padding: 0 12px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-2);
            cursor: pointer;
        }
        .history-btn .badge {
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            border-radius: 999px;
            background: var(--primary);
            color: #fff;
            font-size: 0.75rem;
            line-height: 20px;
            text-align: center;
        }
        .history-btn .badge:empty { display: none; }

        /* ---------- 국내/해외 전환 (세그먼트 버튼) ---------- */
        .segmented {
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding: 4px;
            margin-bottom: 12px;
            border-radius: var(--radius-sm);
            background: var(--border);
        }
        .segmented button {
            height: 40px;
            border: 0;
            border-radius: 9px;
            background: transparent;
            font-size: 0.9375rem;
            font-weight: 600;
            color: var(--text-3);
            cursor: pointer;
            transition: background .2s, color .2s;
        }
        .segmented button[aria-selected="true"] {
            background: var(--surface);
            color: var(--text);
            box-shadow: 0 1px 3px rgba(0,0,0,.08);
        }

        /* ---------- 카드 ---------- */
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px;
            margin-bottom: 12px;
        }
        .panel[hidden] { display: none; }

        /* ---------- 입력칸 ---------- */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .field { display: block; margin-bottom: 14px; }
        .field-label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--text-2);
        }
        .input-wrap { position: relative; }
        .input-wrap input {
            width: 100%;
            height: 52px;
            padding: 0 40px 0 14px;
            border: 1.5px solid transparent;
            border-radius: var(--radius-sm);
            background: var(--surface-2);
            color: var(--text);
            font: inherit;
            font-size: 1.125rem;          /* 16px 이상 → 아이폰에서 입력 시 화면 확대 안 됨 */
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            outline: none;
            transition: border-color .15s, background .15s;
        }
        .input-wrap input::placeholder { color: var(--text-3); font-weight: 400; }
        .input-wrap input:focus {
            border-color: var(--primary);
            background: var(--surface);
        }
        .input-wrap .unit {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-3);
            font-size: 0.9375rem;
            pointer-events: none;
        }
        .input-wrap.prefix input { padding-left: 30px; }
        .input-wrap .prefix-unit {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-3);
            font-weight: 600;
            pointer-events: none;
        }

        /* ---------- 수수료/세금 설정 (접고 펼치기) ---------- */
        .settings {
            border-top: 1px solid var(--border);
            margin: 4px -20px -20px;
            padding: 0 20px;
        }
        .settings summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 16px 0;
            cursor: pointer;
            list-style: none;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-2);
        }
        .settings summary::-webkit-details-marker { display: none; }
        .settings summary .chip {
            margin-left: auto;
            font-weight: 400;
            color: var(--text-3);
            font-size: 0.8125rem;
            text-align: right;
        }
        .settings summary::after {
            content: '';
            width: 8px;
            height: 8px;
            border-right: 2px solid var(--text-3);
            border-bottom: 2px solid var(--text-3);
            transform: rotate(45deg) translateY(-3px);
            transition: transform .2s;
            flex-shrink: 0;
        }
        .settings[open] summary::after { transform: rotate(-135deg) translateY(-3px); }
        .settings .settings-body { padding-bottom: 6px; }
        .settings .input-wrap input { height: 44px; font-size: 1rem; }
        .hint {
            display: block;
            margin-top: 4px;
            font-size: 0.75rem;
            color: var(--text-3);
        }

        /* ---------- 결과 카드 ---------- */
        .result-card { padding: 24px 20px 20px; }
        .result-empty {
            text-align: center;
            color: var(--text-3);
            font-size: 0.9375rem;
            padding: 20px 0 16px;
            line-height: 1.6;
        }
        .result-empty .icon { font-size: 2rem; display: block; margin-bottom: 4px; }
        .result-label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-2);
        }
        .result-amount {
            margin: 4px 0 8px;
            font-size: 2.125rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            font-variant-numeric: tabular-nums;
            word-break: keep-all;
        }
        .result-amount small { font-size: 1.25rem; font-weight: 700; margin-left: 2px; }
        .rate-pill {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.875rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }
        .is-up   .result-amount { color: var(--up); }
        .is-down .result-amount { color: var(--down); }
        .is-up   .rate-pill { color: var(--up);   background: var(--up-weak); }
        .is-down .rate-pill { color: var(--down); background: var(--down-weak); }
        .is-flat .rate-pill { color: var(--text-2); background: var(--surface-2); }

        .rows { margin: 20px 0 0; padding: 0; list-style: none; }
        .rows li {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 7px 0;
            font-size: 0.9375rem;
            color: var(--text-2);
        }
        .rows li span:last-child {
            color: var(--text);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            text-align: right;
        }
        .rows li.sub { font-size: 0.8125rem; color: var(--text-3); padding: 3px 0 3px 12px; }
        .rows li.sub span:last-child { color: var(--text-2); font-weight: 500; }
        .rows li.divider { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 12px; }

        .breakdown { margin-top: 8px; }
        .breakdown summary {
            padding: 10px 0;
            cursor: pointer;
            font-size: 0.8125rem;
            color: var(--text-3);
            list-style: none;
            text-align: center;
        }
        .breakdown summary::-webkit-details-marker { display: none; }
        .breakdown summary::after { content: ' ▾'; }
        .breakdown[open] summary::after { content: ' ▴'; }
        .breakdown .rows { margin-top: 0; }
        .note {
            margin: 8px 0 0;
            padding: 10px 12px;
            border-radius: 10px;
            background: var(--surface-2);
            font-size: 0.75rem;
            line-height: 1.5;
            color: var(--text-3);
        }

        .save-btn {
            width: 100%;
            height: 48px;
            margin-top: 16px;
            border: 0;
            border-radius: var(--radius-sm);
            background: var(--primary-weak);
            color: var(--primary);
            font-size: 0.9375rem;
            font-weight: 700;
            cursor: pointer;
        }
        .save-btn:active { transform: scale(.99); }

        /* ---------- 계산 기록 (아래에서 올라오는 시트) ---------- */
        .backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.4);
            opacity: 0;
            visibility: hidden;
            transition: opacity .25s, visibility .25s;
            z-index: 10;
        }
        .sheet {
            position: fixed;
            left: 50%;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            max-height: 75vh;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border-radius: 20px 20px 0 0;
            transform: translate(-50%, 100%);
            visibility: hidden;
            transition: transform .3s cubic-bezier(.2,.8,.2,1), visibility .3s;
            z-index: 11;
        }
        body.sheet-open .backdrop { opacity: 1; visibility: visible; }
        body.sheet-open .sheet { transform: translate(-50%, 0); visibility: visible; }
        .sheet-handle {
            width: 36px; height: 4px;
            margin: 10px auto 0;
            border-radius: 2px;
            background: var(--border);
        }
        .sheet-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px 8px;
        }
        .sheet-header h2 { margin: 0 auto 0 0; font-size: 1.125rem; }
        .text-btn {
            border: 0;
            background: none;
            color: var(--text-3);
            font-size: 0.8125rem;
            cursor: pointer;
            padding: 6px;
        }
        .history-list {
            list-style: none;
            margin: 0;
            padding: 0 12px 24px;
            overflow-y: auto;
        }
        .history-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 8px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            border-radius: 10px;
        }
        .history-item:hover { background: var(--surface-2); }
        .history-item .meta { font-size: 0.75rem; color: var(--text-3); margin-bottom: 2px; }
        .history-item .main { font-size: 0.875rem; font-weight: 600; }
        .history-item .info { flex: 1; min-width: 0; }
        .history-item .pl {
            font-size: 0.875rem;
            font-weight: 700;
            text-align: right;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        .history-item .pl.up { color: var(--up); }
        .history-item .pl.down { color: var(--down); }
        .history-item .del {
            border: 0; background: none; color: var(--text-3);
            font-size: 1rem; cursor: pointer; padding: 4px 6px;
        }
        .history-empty {
            padding: 32px 20px 40px;
            text-align: center;
            color: var(--text-3);
            font-size: 0.9375rem;
        }

        /* ---------- 하단 알림 (토스트) ---------- */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translate(-50%, 20px);
            padding: 10px 16px;
            border-radius: 999px;
            background: #212529;
            color: #fff;
            font-size: 0.875rem;
            opacity: 0;
            transition: opacity .2s, transform .2s;
            pointer-events: none;
            z-index: 20;
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }

        /* ---------- 키보드로 이동할 때만 포커스 테두리 표시 ---------- */
        button:focus-visible, summary:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        /* ---------- PC 화면: 입력(왼쪽) + 결과(오른쪽) 2단 배치 ---------- */
        @media (min-width: 880px) {
            .app { max-width: 920px; padding-top: 32px; }
            .layout {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
                align-items: start;
            }
            .result-col { position: sticky; top: 20px; }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="app-header">
            <h1>주식 손익 계산기</h1>
            <button class="history-btn" id="historyBtn" type="button" aria-haspopup="dialog">
                계산 기록 <span class="badge" id="historyCount"></span>
            </button>
        </header>

        <div class="layout">
            <!-- ===== 입력 영역 ===== -->
            <div class="input-col">
                <div class="segmented" role="tablist" aria-label="주식 종류">
                    <button type="button" role="tab" id="tab-domestic" aria-controls="panel-domestic" aria-selected="true" data-tab="domestic">국내 주식</button>
                    <button type="button" role="tab" id="tab-global" aria-controls="panel-global" aria-selected="false" data-tab="global">해외 주식</button>
                </div>

                <!-- 국내 -->
                <section class="card panel" id="panel-domestic" role="tabpanel" aria-labelledby="tab-domestic" data-type="domestic">
                    <div class="grid-2">
                        <label class="field">
                            <span class="field-label">매수가</span>
                            <span class="input-wrap"><input id="buyPriceD" inputmode="decimal" placeholder="10,000" autocomplete="off"><span class="unit">원</span></span>
                        </label>
                        <label class="field">
                            <span class="field-label">매도가</span>
                            <span class="input-wrap"><input id="sellPriceD" inputmode="decimal" placeholder="11,000" autocomplete="off"><span class="unit">원</span></span>
                        </label>
                    </div>
                    <label class="field">
                        <span class="field-label">수량</span>
                        <span class="input-wrap"><input id="quantityD" inputmode="numeric" data-int placeholder="10" autocomplete="off"><span class="unit">주</span></span>
                    </label>

                    <details class="settings">
                        <summary>수수료·세금 <span class="chip" id="chipD"></span></summary>
                        <div class="settings-body grid-2">
                            <label class="field">
                                <span class="field-label">증권사 수수료</span>
                                <span class="input-wrap"><input id="commRateD" inputmode="decimal" value="0.015"><span class="unit">%</span></span>
                                <span class="hint">매수·매도 각각</span>
                            </label>
                            <label class="field">
                                <span class="field-label">거래세</span>
                                <span class="input-wrap"><input id="taxRateD" inputmode="decimal" value="0.20"><span class="unit">%</span></span>
                                <span class="hint">매도할 때만</span>
                            </label>
                        </div>
                    </details>
                </section>

                <!-- 해외 -->
                <section class="card panel" id="panel-global" role="tabpanel" aria-labelledby="tab-global" data-type="global" hidden>
                    <div class="grid-2">
                        <label class="field">
                            <span class="field-label">매수가</span>
                            <span class="input-wrap prefix"><span class="prefix-unit">$</span><input id="buyPriceG" inputmode="decimal" placeholder="100" autocomplete="off"></span>
                        </label>
                        <label class="field">
                            <span class="field-label">매도가</span>
                            <span class="input-wrap prefix"><span class="prefix-unit">$</span><input id="sellPriceG" inputmode="decimal" placeholder="110" autocomplete="off"></span>
                        </label>
                    </div>
                    <label class="field">
                        <span class="field-label">수량</span>
                        <span class="input-wrap"><input id="quantityG" inputmode="numeric" data-int placeholder="10" autocomplete="off"><span class="unit">주</span></span>
                    </label>
                    <div class="grid-2">
                        <label class="field">
                            <span class="field-label">매수 시 환율</span>
                            <span class="input-wrap"><input id="exchangeRateBuyG" inputmode="decimal" placeholder="매도와 동일" autocomplete="off"><span class="unit">원</span></span>
                        </label>
                        <label class="field">
                            <span class="field-label">매도 시 환율</span>
                            <span class="input-wrap"><input id="exchangeRateG" inputmode="decimal" value="1,300" autocomplete="off"><span class="unit">원</span></span>
                        </label>
                    </div>

                    <details class="settings">
                        <summary>수수료·세금 <span class="chip" id="chipG"></span></summary>
                        <div class="settings-body">
                            <div class="grid-2">
                                <label class="field">
                                    <span class="field-label">증권사 수수료</span>
                                    <span class="input-wrap"><input id="commRateG" inputmode="decimal" value="0.10"><span class="unit">%</span></span>
                                    <span class="hint">매수·매도 각각</span>
                                </label>
                                <label class="field">
                                    <span class="field-label">양도소득세</span>
                                    <span class="input-wrap"><input id="taxRateG" inputmode="decimal" value="22.0"><span class="unit">%</span></span>
                                    <span class="hint">지방소득세 포함</span>
                                </label>
                            </div>
                            <label class="field">
                                <span class="field-label">양도소득세 기본 공제</span>
                                <span class="input-wrap"><input id="taxBaseG" inputmode="numeric" data-int value="2,500,000"><span class="unit">원</span></span>
                                <span class="hint">1년에 한 번 적용돼요</span>
                            </label>
                        </div>
                    </details>
                </section>
            </div>

            <!-- ===== 결과 영역 ===== -->
            <div class="result-col">
                <section class="card result-card" id="result" aria-live="polite"></section>
            </div>
        </div>
    </div>

    <!-- ===== 계산 기록 시트 ===== -->
    <div class="backdrop" id="backdrop"></div>
    <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
            <h2 id="sheetTitle">계산 기록</h2>
            <button type="button" class="text-btn" id="clearHistory">전체 삭제</button>
            <button type="button" class="text-btn" id="closeSheet" aria-label="닫기">✕</button>
        </div>
        <ul class="history-list" id="historyList"></ul>
    </aside>

    <div class="toast" id="toast" role="status"></div>

    <script>
        /* =========================================================
         * 공통 도구
         * ========================================================= */
        const $ = (id) => document.getElementById(id);

        // 입력칸의 쉼표를 빼고 숫자로 변환 (빈 칸이면 NaN)
        const readNum = (id) => parseFloat(($(id).value || '').replace(/,/g, ''));

        // 원화 표시: 1234567.8 → "1,234,568"
        const won = (n) => Math.round(n).toLocaleString('ko-KR');

        // 부호 붙인 원화: +97,485 / −1,200
        const signedWon = (n) => (Math.round(n) > 0 ? '+' : Math.round(n) < 0 ? '−' : '') + won(Math.abs(n));

        // 입력하는 동안 세 자리마다 쉼표 추가
        // [개선] 예전 방식은 숫자 중간을 고치면 커서가 맨 뒤로 튀었음 → 커서 위치를 기억했다가 복원
        function autoFormat(input) {
            const old = input.value;
            const caret = input.selectionStart ?? old.length;
            const allowDot = !input.hasAttribute('data-int');
            const keep = allowDot ? /[\d.]/ : /\d/;
            // 커서 앞에 있던 "의미 있는 글자(숫자, 소수점)" 개수
            const before = [...old.slice(0, caret)].filter(ch => keep.test(ch)).length;

            let clean = [...old].filter(ch => keep.test(ch)).join('');
            const dot = clean.indexOf('.');
            if (dot !== -1) clean = clean.slice(0, dot + 1) + clean.slice(dot + 1).replace(/\./g, '');
            const [intPart, decPart] = clean.split('.');
            const formatted = (intPart || '').replace(/\B(?=(\d{3})+(?!\d))/g, ',')
                            + (decPart !== undefined ? '.' + decPart : '');
            input.value = formatted;

            // 같은 개수의 의미 있는 글자 뒤로 커서 복원
            if (document.activeElement === input) {
                let pos = 0, count = 0;
                while (pos < formatted.length && count < before) {
                    if (keep.test(formatted[pos])) count++;
                    pos++;
                }
                input.setSelectionRange(pos, pos);
            }
        }

        /* =========================================================
         * 계산 (현재 index.html과 같은 공식)
         * ========================================================= */
        function calculate(type) {
            let buyPrice, sellPrice, quantity, commRate, taxRate, taxName, taxBase = 0, rateBuy, rateSell;

            if (type === 'domestic') {
                buyPrice = readNum('buyPriceD');
                sellPrice = readNum('sellPriceD');
                quantity = parseInt(($('quantityD').value || '').replace(/,/g, ''));
                commRate = (readNum('commRateD') || 0) / 100;
                taxRate = (readNum('taxRateD') || 0) / 100;
                taxName = '거래세';
            } else {
                buyPrice = readNum('buyPriceG');
                sellPrice = readNum('sellPriceG');
                quantity = parseInt(($('quantityG').value || '').replace(/,/g, ''));
                commRate = (readNum('commRateG') || 0) / 100;
                taxRate = (readNum('taxRateG') || 0) / 100;
                taxBase = readNum('taxBaseG') || 0;
                taxName = '양도소득세';
                rateSell = readNum('exchangeRateG');
                rateBuy = readNum('exchangeRateBuyG') || rateSell;
                if (!rateSell) return null;
                buyPrice *= rateBuy;    // 취득가액: 매수일 환율
                sellPrice *= rateSell;  // 양도가액: 매도일 환율
            }

            if (isNaN(buyPrice) || isNaN(sellPrice) || isNaN(quantity) || quantity <= 0 || buyPrice <= 0) {
                return null; // 아직 입력이 덜 됨
            }

            const totalBuy = buyPrice * quantity;
            const buyComm = totalBuy * commRate;
            const totalSell = sellPrice * quantity;
            const sellComm = totalSell * commRate;
            const beforeTax = totalSell - totalBuy - buyComm - sellComm;

            let tax = 0;
            if (type === 'domestic') {
                tax = totalSell * taxRate;
            } else if (beforeTax > 0) {
                // 양도차익(수수료 공제 후) - 기본 공제 → 과세표준
                tax = Math.max(0, beforeTax - taxBase) * taxRate;
            }
            const net = beforeTax - tax;

            return {
                type, quantity, commRate, taxRate, taxName, taxBase, rateBuy, rateSell,
                totalBuy, buyComm, totalSell, sellComm, beforeTax, tax, net,
                rate: net / totalBuy * 100,
                payIn: totalBuy + buyComm,              // 실제로 낸 돈
                payOut: totalSell - sellComm - tax,     // 실제로 받는 돈
            };
        }

        /* =========================================================
         * 결과 그리기
         * ========================================================= */
        let currentTab = 'domestic';
        let lastResult = null;

        function renderResult() {
            const r = calculate(currentTab);
            lastResult = r;
            const box = $('result');

            if (!r) {
                box.className = 'card result-card';
                box.innerHTML = `
                    <div class="result-empty">
                        <span class="icon">🧮</span>
                        매수가·매도가·수량을 입력하면<br>바로 계산돼요
                    </div>`;
                return;
            }

            const dir = Math.round(r.net) > 0 ? 'is-up' : Math.round(r.net) < 0 ? 'is-down' : 'is-flat';
            const arrow = dir === 'is-up' ? '▲' : dir === 'is-down' ? '▼' : '';
            const pct = (n) => (n * 100).toFixed(3).replace(/\.?0+$/, '') + '%';

            let fxRow = '';
            let note = '';
            if (r.type === 'global') {
                const fx = r.rateBuy === r.rateSell
                    ? `${won(r.rateSell)}원`
                    : `${won(r.rateBuy)} → ${won(r.rateSell)}원`;
                fxRow = `<li><span>적용 환율 (USD)</span><span>${fx}</span></li>`;
                note = `<p class="note">기본 공제 ${won(r.taxBase)}원을 이 거래에 모두 적용한 금액이에요.
                        기본 공제는 1년에 한 번이라, 올해 다른 해외주식 손익이 있으면 실제 세금은 달라질 수 있어요.</p>`;
            }

            box.className = `card result-card ${dir}`;
            box.innerHTML = `
                <div class="result-label">예상 순손익 <span style="font-weight:400;color:var(--text-3)">(수수료·세금 차감)</span></div>
                <div class="result-amount">${signedWon(r.net)}<small>원</small></div>
                <span class="rate-pill">${arrow} ${Math.abs(r.rate).toFixed(2)}%</span>

                <ul class="rows">
                    <li><span>내는 돈 (매수+수수료)</span><span>${won(r.payIn)}원</span></li>
                    <li><span>받는 돈 (매도−수수료−세금)</span><span>${won(r.payOut)}원</span></li>
                    <li><span>수수료·세금 합계</span><span>${won(r.buyComm + r.sellComm + r.tax)}원</span></li>
                </ul>

                <details class="breakdown">
                    <summary>계산 내역 자세히 보기</summary>
                    <ul class="rows">
                        <li><span>매수 금액</span><span>${won(r.totalBuy)}원</span></li>
                        <li class="sub"><span>매수 수수료 (${pct(r.commRate)})</span><span>${won(r.buyComm)}원</span></li>
                        <li><span>매도 금액</span><span>${won(r.totalSell)}원</span></li>
                        <li class="sub"><span>매도 수수료 (${pct(r.commRate)})</span><span>${won(r.sellComm)}원</span></li>
                        <li class="sub"><span>${r.taxName} (${pct(r.taxRate)})</span><span>${won(r.tax)}원</span></li>
                        ${fxRow}
                        <li class="divider"><span>세전 손익</span><span>${signedWon(r.beforeTax)}원</span></li>
                        <li><span>순손익</span><span>${signedWon(r.net)}원</span></li>
                        <li><span>수익률</span><span>${r.rate.toFixed(3)}%</span></li>
                    </ul>
                    ${note}
                </details>

                <button type="button" class="save-btn" id="saveBtn">기록에 저장</button>`;
            $('saveBtn').addEventListener('click', saveCurrent);
        }

        /* =========================================================
         * 설정 요약 문구 (접혀 있어도 현재 값이 보이게)
         * ========================================================= */
        function updateChips() {
            $('chipD').textContent = `수수료 ${$('commRateD').value || 0}% · 거래세 ${$('taxRateD').value || 0}%`;
            $('chipG').textContent = `수수료 ${$('commRateG').value || 0}% · 양도세 ${$('taxRateG').value || 0}%`;
        }

        /* =========================================================
         * 탭 전환
         * ========================================================= */
        function switchTab(type) {
            currentTab = type;
            document.querySelectorAll('.segmented button').forEach(btn => {
                btn.setAttribute('aria-selected', String(btn.dataset.tab === type));
            });
            $('panel-domestic').hidden = type !== 'domestic';
            $('panel-global').hidden = type !== 'global';
            renderResult();
        }

        /* =========================================================
         * 계산 기록 (index.html과 같은 저장소·형식 → 기존 기록 그대로 보임)
         * ========================================================= */
        const HISTORY_KEY = 'stockCalculator.history';
        const FIELD_IDS = ['buyPriceD', 'sellPriceD', 'quantityD', 'commRateD', 'taxRateD',
                           'buyPriceG', 'sellPriceG', 'quantityG', 'commRateG', 'taxRateG', 'taxBaseG',
                           'exchangeRateG', 'exchangeRateBuyG'];
        let history = [];

        function loadHistory() {
            try { history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
            catch (e) { history = []; }
        }
        function persistHistory() {
            try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch (e) { /* 저장 실패는 무시 */ }
        }

        function saveCurrent() {
            const r = lastResult;
            if (!r) return;
            const data = {};
            FIELD_IDS.forEach(id => { data[id] = readNum(id); });

            const now = new Date();
            const p = (n) => String(n).padStart(2, '0');
            const buyText = r.type === 'global'
                ? `$${readNum('buyPriceG').toLocaleString('en-US', { maximumFractionDigits: 2 })}`
                : `${won(readNum('buyPriceD'))}원`;
            const sellText = r.type === 'global'
                ? `$${readNum('sellPriceG').toLocaleString('en-US', { maximumFractionDigits: 2 })}`
                : `${won(readNum('sellPriceD'))}원`;

            history.unshift({
                type: r.type,
                data,
                summary: `매수: ${buyText} | 수량: ${won(r.quantity)}`, // index.html과 호환
                title: `${buyText} → ${sellText} × ${won(r.quantity)}주`,
                net: r.net,
                rate: r.rate,
                timestamp: `${p(now.getMonth() + 1)}/${p(now.getDate())} ${p(now.getHours())}:${p(now.getMinutes())}:${p(now.getSeconds())}`,
            });
            persistHistory();
            renderHistory();
            showToast('기록에 저장했어요');
        }

        function renderHistory() {
            const list = $('historyList');
            list.innerHTML = '';
            $('historyCount').textContent = history.length ? String(history.length) : '';
            $('clearHistory').hidden = history.length === 0;

            if (history.length === 0) {
                list.innerHTML = '<li class="history-empty">아직 저장한 기록이 없어요.<br>계산 후 “기록에 저장”을 눌러보세요.</li>';
                return;
            }

            history.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = 'history-item';

                const info = document.createElement('div');
                info.className = 'info';
                const meta = document.createElement('div');
                meta.className = 'meta';
                meta.textContent = `${item.type === 'domestic' ? '국내' : '해외'} · ${item.timestamp}`;
                const main = document.createElement('div');
                main.className = 'main';
                main.textContent = item.title || item.summary; // 예전 기록은 summary 표시
                info.append(meta, main);
                li.append(info);

                if (typeof item.net === 'number') {
                    const pl = document.createElement('div');
                    const dir = Math.round(item.net) > 0 ? 'up' : Math.round(item.net) < 0 ? 'down' : '';
                    pl.className = `pl ${dir}`;
                    pl.innerHTML = `${signedWon(item.net)}원<br><span style="font-size:.75rem">${item.rate.toFixed(2)}%</span>`;
                    li.append(pl);
                }

                const del = document.createElement('button');
                del.type = 'button';
                del.className = 'del';
                del.setAttribute('aria-label', '이 기록 삭제');
                del.textContent = '✕';
                del.addEventListener('click', (e) => {
                    e.stopPropagation(); // 항목 클릭(불러오기)으로 번지지 않게
                    history.splice(index, 1);
                    persistHistory();
                    renderHistory();
                });
                li.append(del);

                li.addEventListener('click', () => applyHistory(item));
                list.append(li);
            });
        }

        function applyHistory(item) {
            FIELD_IDS.forEach(id => {
                const v = item.data ? item.data[id] : undefined;
                const empty = v === undefined || v === null || Number.isNaN(v);
                const input = $(id);
                input.value = empty ? '' : String(v);
                autoFormat(input);
            });
            updateChips();
            switchTab(item.type);
            closeSheet();
        }

        /* ---------- 시트 열기/닫기 ---------- */
        function openSheet() { document.body.classList.add('sheet-open'); $('closeSheet').focus(); }
        function closeSheet() { document.body.classList.remove('sheet-open'); }

        /* ---------- 토스트 ---------- */
        let toastTimer;
        function showToast(msg) {
            const t = $('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
        }

        /* =========================================================
         * 이벤트 연결
         * ========================================================= */
        document.querySelectorAll('.segmented button').forEach(btn => {
            btn.addEventListener('click', () => switchTab(btn.dataset.tab));
        });

        // 입력할 때마다: 쉼표 정리 → 설정 요약 갱신 → 즉시 재계산
        document.querySelectorAll('.panel input').forEach(input => {
            input.addEventListener('input', () => {
                autoFormat(input);
                updateChips();
                renderResult();
            });
        });

        $('historyBtn').addEventListener('click', openSheet);
        $('closeSheet').addEventListener('click', closeSheet);
        $('backdrop').addEventListener('click', closeSheet);
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
        $('clearHistory').addEventListener('click', () => {
            if (confirm('계산 기록을 모두 지울까요?')) {
                history = [];
                persistHistory();
                renderHistory();
            }
        });

        loadHistory();
        renderHistory();
        updateChips();
        renderResult();
    </script>
</body>
</html>
