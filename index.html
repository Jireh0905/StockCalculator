<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f1f3f5" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#101214" media="(prefers-color-scheme: dark)">
    <title>주식 손익 계산기</title>
    <!-- 한글 웹폰트 Pretendard (무료 오픈소스 폰트). 불러오지 못하면 기기 기본 글꼴로 표시됨 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <!-- 화면 꾸미기(CSS)는 css/style.css 파일로 분리 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <header class="app-header">
            <h1>주식 손익 계산기</h1>
            <button class="history-btn" id="historyBtn" type="button" aria-haspopup="dialog">
                계산 기록 <span class="badge" id="historyCount"></span>
            </button>
        </header>

        <div class="layout">
            <!-- ===== 입력 영역 ===== -->
            <div class="input-col">
                <div class="segmented" role="tablist" aria-label="주식 종류">
                    <button type="button" role="tab" id="tab-domestic" aria-controls="panel-domestic" aria-selected="true" data-tab="domestic">국내 주식</button>
                    <button type="button" role="tab" id="tab-global" aria-controls="panel-global" aria-selected="false" data-tab="global">해외 주식</button>
                </div>

                <!-- 국내 -->
                <section class="card panel" id="panel-domestic" role="tabpanel" aria-labelledby="tab-domestic" data-type="domestic">
                    <div class="grid-2">
                        <label class="field">
                            <span class="field-label">매수가</span>
                            <span class="input-wrap"><input id="buyPriceD" inputmode="decimal" placeholder="10,000" autocomplete="off"><span class="unit">원</span></span>
                        </label>
                        <label class="field">
                            <span class="field-label">매도가</span>
                            <span class="input-wrap"><input id="sellPriceD" inputmode="decimal" placeholder="11,000" autocomplete="off"><span class="unit">원</span></span>
                        </label>
                    </div>
                    <label class="field">
                        <span class="field-label">수량</span>
                        <span class="input-wrap"><input id="quantityD" inputmode="numeric" data-int placeholder="10" autocomplete="off"><span class="unit">주</span></span>
                    </label>

                    <details class="settings">
                        <summary>수수료·세금 <span class="chip" id="chipD"></span></summary>
                        <div class="settings-body grid-2">
                            <label class="field">
                                <span class="field-label">증권사 수수료</span>
                                <span class="input-wrap"><input id="commRateD" inputmode="decimal" value="0.015"><span class="unit">%</span></span>
                                <span class="hint">매수·매도 각각</span>
                            </label>
                            <label class="field">
                                <span class="field-label">거래세</span>
                                <span class="input-wrap"><input id="taxRateD" inputmode="decimal" value="0.20"><span class="unit">%</span></span>
                                <span class="hint">매도할 때만</span>
                            </label>
                        </div>
                    </details>
                </section>

                <!-- 해외 -->
                <section class="card panel" id="panel-global" role="tabpanel" aria-labelledby="tab-global" data-type="global" hidden>
                    <div class="grid-2">
                        <label class="field">
                            <span class="field-label">매수가</span>
                            <span class="input-wrap prefix"><span class="prefix-unit">$</span><input id="buyPriceG" inputmode="decimal" placeholder="100" autocomplete="off"></span>
                        </label>
                        <label class="field">
                            <span class="field-label">매도가</span>
                            <span class="input-wrap prefix"><span class="prefix-unit">$</span><input id="sellPriceG" inputmode="decimal" placeholder="110" autocomplete="off"></span>
                        </label>
                    </div>
                    <label class="field">
                        <span class="field-label">수량</span>
                        <span class="input-wrap"><input id="quantityG" inputmode="numeric" data-int placeholder="10" autocomplete="off"><span class="unit">주</span></span>
                    </label>
                    <div class="grid-2">
                        <label class="field">
                            <span class="field-label">매수 시 환율</span>
                            <span class="input-wrap"><input id="exchangeRateBuyG" inputmode="decimal" placeholder="매도와 동일" autocomplete="off"><span class="unit">원</span></span>
                        </label>
                        <label class="field">
                            <span class="field-label">매도 시 환율</span>
                            <span class="input-wrap"><input id="exchangeRateG" inputmode="decimal" value="1,300" autocomplete="off"><span class="unit">원</span></span>
                        </label>
                    </div>

                    <details class="settings">
                        <summary>수수료·세금 <span class="chip" id="chipG"></span></summary>
                        <div class="settings-body">
                            <div class="grid-2">
                                <label class="field">
                                    <span class="field-label">증권사 수수료</span>
                                    <span class="input-wrap"><input id="commRateG" inputmode="decimal" value="0.10"><span class="unit">%</span></span>
                                    <span class="hint">매수·매도 각각</span>
                                </label>
                                <label class="field">
                                    <span class="field-label">양도소득세</span>
                                    <span class="input-wrap"><input id="taxRateG" inputmode="decimal" value="22.0"><span class="unit">%</span></span>
                                    <span class="hint">지방소득세 포함</span>
                                </label>
                            </div>
                            <label class="field">
                                <span class="field-label">양도소득세 기본 공제</span>
                                <span class="input-wrap"><input id="taxBaseG" inputmode="numeric" data-int value="2,500,000"><span class="unit">원</span></span>
                                <span class="hint">1년에 한 번 적용돼요</span>
                            </label>
                        </div>
                    </details>
                </section>
            </div>

            <!-- ===== 결과 영역 ===== -->
            <div class="result-col">
                <section class="card result-card" id="result" aria-live="polite"></section>
            </div>
        </div>
    </div>

    <!-- ===== 계산 기록 시트 ===== -->
    <div class="backdrop" id="backdrop"></div>
    <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
            <h2 id="sheetTitle">계산 기록</h2>
            <button type="button" class="text-btn" id="clearHistory">전체 삭제</button>
            <button type="button" class="text-btn" id="closeSheet" aria-label="닫기">✕</button>
        </div>
        <ul class="history-list" id="historyList"></ul>
    </aside>

    <div class="toast" id="toast" role="status"></div>

    <!-- JavaScript는 js/ 폴더에 역할별로 나눠져 있어요. 시작점은 main.js (README.md 참고) -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
