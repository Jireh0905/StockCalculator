<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f1f3f5" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#101214" media="(prefers-color-scheme: dark)">
    <title>Jireh</title>
    <!-- 한글 웹폰트 Pretendard (무료 오픈소스 폰트). 불러오지 못하면 기기 기본 글꼴로 표시됨 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!--
        이 파일은 모든 화면이 함께 쓰는 "틀"만 가지고 있어요. (MFC의 메인 프레임)
        가운데 <main id="view"> 안의 내용은 js/app.js가 주소(#/...)에 맞게 바꿔 끼워요.
    -->

    <!-- ===== 왼쪽 메뉴 ===== -->
    <div class="scrim" id="scrim"></div>
    <nav class="drawer" id="drawer" aria-label="기능 메뉴">
        <div class="drawer-head">
            <span class="logo">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
            </span>
            <b>Jireh</b>
        </div>
        <div class="nav" id="nav"></div>
        <div class="drawer-foot">
            <p>입력값과 계산 기록은 <b>창을 닫으면</b> 사라져요.<br>다른 기능으로 이동해도 그대로 남아 있어요.</p>
            <button type="button" class="ghost-btn" id="resetBtn">지금 모두 초기화</button>
        </div>
    </nav>

    <div class="shell">
        <!-- ===== 상단 바 ===== -->
        <header class="appbar">
            <button type="button" class="icon-btn menu-btn" id="menuBtn" aria-label="메뉴 열기" aria-controls="drawer">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <h1 id="pageTitle">Jireh</h1>
            <!-- 인터넷 연결 상태 (js/core/network.js가 알려주면 app.js가 바꿔요). 누르면 설명 + 다시 확인 -->
            <button type="button" class="net-chip" id="netStatus" data-state="online"><i></i><span class="net-label">온라인</span></button>
            <button type="button" class="history-btn" id="historyBtn" aria-haspopup="dialog">
                기록 <span class="badge" id="historyCount"></span>
            </button>
        </header>

        <!-- ===== 화면이 바뀌는 자리 ===== -->
        <main class="content" id="view"></main>
    </div>

    <!-- ===== 계산 기록 시트 ===== -->
    <div class="backdrop" id="backdrop"></div>
    <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
            <h2 id="sheetTitle">계산 기록</h2>
            <button type="button" class="text-btn" id="clearHistory">전체 삭제</button>
            <button type="button" class="text-btn" id="closeSheet" aria-label="닫기">✕</button>
        </div>
        <!-- 보기 범위: 같은 그룹(예: 계산기) 전체 / 지금 기능만 -->
        <div class="sheet-filter" id="historyFilter" role="group" aria-label="기록 보기 범위"></div>
        <ul class="history-list" id="historyList"></ul>
    </aside>

    <div class="toast" id="toast" role="status"></div>

    <!-- JavaScript 시작점: js/app.js (README.md 참고) -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
